name: Android APK 72 to 73 offline QA

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: SHA of the reviewed QA branch commit that contains this workflow
        type: string
        required: true
      apk73_sha256:
        description: SHA-256 of the exact signed ARM64 APK 73
        type: string
        required: true
      probe_demo_cache:
        description: Compare the known synthetic APK 72 HR cache before and after the upgrade
        type: boolean
        default: true
      run_functional_demo:
        description: Exercise the fresh offline HACCP and HR demo after successful upgrade and cache verification
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apk73-offline-native-qa
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ANDROID_SERIAL: emulator-5554
      APK73_SHA256: ${{ inputs.apk73_sha256 }}
    steps:
      - name: Check the requested branch and commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/qa/apk73-native ]]
          [[ "$EXPECTED_HEAD" =~ ^[a-fA-F0-9]{40}$ && "$GITHUB_SHA" == "${EXPECTED_HEAD,,}" ]]
          [[ "$APK73_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare the pinned Android system image and KVM
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]]
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          [[ -r /dev/kvm && -w /dev/kvm ]]
          avd_home="$RUNNER_TEMP/apk73-android-avd"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          image="$ANDROID_HOME/system-images/android-30/google_apis/x86_64"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [[ ! -f "$image/system.img" || ! -x "$build_tools/apksigner" ]]; then
            "$sdkmanager" 'system-images;android-30;google_apis;x86_64' 'build-tools;36.0.0' </dev/null
          fi
          [[ -f "$image/system.img" && -x "$build_tools/aapt" && -x "$build_tools/apksigner" ]]
          grep -Eq '^Pkg\.Revision=16[[:space:]]*$' "$image/source.properties"
          archive="$RUNNER_TEMP/emulator-37.1.11.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --connect-timeout 20 --max-time 240 -o "$archive" \
            https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip
          printf '%s  %s\n' '95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266' "$archive" | sha256sum --check
          mkdir -p "$avd_home" "$RUNNER_TEMP/apk73-emulator"
          unzip -q "$archive" -d "$RUNNER_TEMP/apk73-emulator"
          emulator="$RUNNER_TEMP/apk73-emulator/emulator/emulator"
          "$emulator" -accel-check | grep -Eq 'KVM.*(installed|usable)'
          export ANDROID_AVD_HOME="$avd_home"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd \
            --name manager247_apk73 --package 'system-images;android-30;google_apis;x86_64' --device pixel_3a
          printf 'ANDROID_AVD_HOME=%s\nQA_APK_DIR=%s\nQA_EMULATOR=%s\n' \
            "$avd_home" "$RUNNER_TEMP/apk73-inputs" "$emulator" >> "$GITHUB_ENV"

      - name: Download and verify both original signed APKs
        shell: bash
        env:
          QA_APK72_URL_1: ${{ secrets.QA_APK72_URL_1 }}
          QA_APK72_URL_2: ${{ secrets.QA_APK72_URL_2 }}
          QA_APK72_URL_3: ${{ secrets.QA_APK72_URL_3 }}
          QA_APK72_URL_4: ${{ secrets.QA_APK72_URL_4 }}
          QA_APK73_URL_1: ${{ secrets.QA_APK73_URL_1 }}
          QA_APK73_URL_2: ${{ secrets.QA_APK73_URL_2 }}
          QA_APK73_URL_3: ${{ secrets.QA_APK73_URL_3 }}
          QA_APK73_URL_4: ${{ secrets.QA_APK73_URL_4 }}
        run: |
          set -euo pipefail
          umask 077
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 scripts/qa/apk73-native-upgrade.py prepare \
            --apk-dir "$QA_APK_DIR" --report "$RUNNER_TEMP/apk73-provenance.json" \
            --aapt "$build_tools/aapt" --apksigner "$build_tools/apksigner"

      - name: Boot and test the original APKs offline
        id: offline_smoke
        shell: bash
        env:
          PROBE_DEMO_CACHE: ${{ inputs.probe_demo_cache }}
          RUN_FUNCTIONAL_DEMO: ${{ inputs.run_functional_demo }}
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          report="$RUNNER_TEMP/apk73-native-report.json"
          emulator_pid=
          # Bash invokes this through the EXIT trap.
          # shellcheck disable=SC2329
          cleanup() {
            if [[ -n "$emulator_pid" ]]; then
              timeout 10 "$adb" -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
              kill "$emulator_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          "$QA_EMULATOR" -avd manager247_apk73 -port 5554 -accel on -gpu swiftshader \
            -no-window -no-snapshot -no-boot-anim -no-audio -camera-back none -camera-front none \
            >"$RUNNER_TEMP/apk73-emulator.log" 2>&1 &
          emulator_pid=$!
          ready=false
          for ((attempt=0; attempt<90; attempt++)); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            if [[ "$(timeout 3 "$adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]] \
              && timeout 5 "$adb" -s "$ANDROID_SERIAL" shell service check package 2>/dev/null | grep -q 'Service package: found'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo 'Android boot or package service did not become ready. No APK was installed.' >&2
            exit 1
          fi
          "$adb" -s "$ANDROID_SERIAL" shell wm dismiss-keyguard
          args=()
          if [[ "$PROBE_DEMO_CACHE" == true ]]; then args+=(--probe-demo-cache); fi
          result=0
          python3 scripts/qa/apk73-native-upgrade.py native "${args[@]}" \
            --apk-dir "$QA_APK_DIR" --report "$report" --adb "$adb" --serial "$ANDROID_SERIAL" \
            --aapt "$build_tools/aapt" --apksigner "$build_tools/apksigner" || result=$?
          if [[ -s "$report" ]]; then
            {
              printf '### APK 72 to 73 native QA\n\n'
              sed 's/^/    /' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$RUN_FUNCTIONAL_DEMO" == true && "$result" == 0 ]]; then
            functional_dir="$RUNNER_TEMP/apk73-functional-evidence"
            python3 scripts/qa/apk73-functional-qa.py --execute \
              --adb "$adb" --serial "$ANDROID_SERIAL" --upgrade-report "$report" \
              --apk73-sha256 "${APK73_SHA256,,}" --evidence "$functional_dir" || result=$?
            {
              printf '\n### Fresh offline demo on APK 73\n\n'
              if [[ -s "$functional_dir/functional-report.json" ]]; then
                sed 's/^/    /' "$functional_dir/functional-report.json"
              else
                printf 'INCOMPLETE. The helper did not produce a report.\n'
              fi
              if [[ "$result" != 0 && -d "$functional_dir" ]]; then
                observation="$(find "$functional_dir" -maxdepth 1 -type f -name '*-unverified.xml' -print -quit)"
                if [[ -n "$observation" ]]; then
                  printf '\nSanitized UI snapshot excerpt (up to 60 lines).\n\n'
                  awk 'NR <= 60 { print "    " substr($0, 1, 360) }' "$observation"
                fi
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RUN_FUNCTIONAL_DEMO" == true ]]; then
            printf '\n### Fresh offline demo on APK 73\n\nNOT_RUN. Package upgrade and cache verification did not pass.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Select completed synthetic demo screenshots
        id: visual_evidence
        if: ${{ !cancelled() && inputs.run_functional_demo && (steps.offline_smoke.outcome == 'success' || steps.offline_smoke.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          images="$(python3 scripts/qa/apk73-functional-qa.py --list-screenshots "$RUNNER_TEMP/apk73-functional-evidence")"
          if [[ -n "$images" ]]; then
            printf 'paths<<APK73_PNG_PATHS\n%s\nAPK73_PNG_PATHS\n' "$images" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload approved synthetic demo screenshots
        if: ${{ !cancelled() && steps.visual_evidence.outputs.paths != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apk73-offline-demo-screenshots
          path: ${{ steps.visual_evidence.outputs.paths }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary APK inputs, AVD and demo evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runner_root="$(realpath -e -- "$RUNNER_TEMP")"
          [[ -d "$runner_root" && "$runner_root" != / ]]
          inputs="$runner_root/apk73-inputs"
          avd="$runner_root/apk73-android-avd"
          functional_dir="$runner_root/apk73-functional-evidence"
          for directory in "$inputs" "$avd" "$functional_dir"; do
            [[ ! -L "$directory" && "$(realpath -m -- "$directory")" == "$directory" ]]
            [[ ! -e "$directory" || -d "$directory" ]]
          done
          rm -f -- "$inputs/apk72.apk" "$inputs/apk73.apk" \
            "$inputs/apk72.download" "$inputs/apk73.download"
          for directory in "$avd" "$functional_dir"; do
            if [[ -d "$directory" ]]; then rm -rf -- "$directory"; fi
          done
