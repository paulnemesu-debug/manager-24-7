name: Android APK74 source-matched x86 QA
run-name: APK74 x86 QA ${{ inputs.transfer_id }}
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Reviewed QA workflow commit (separate from release source HEAD)
        type: string
        required: true
      apk74_sha256:
        description: Exact QA-only x86 APK74 SHA-256
        type: string
        required: true
      transfer_id:
        description: Non-secret receipt identifier used to correlate exactly one dispatch
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: apk74-offline-x86-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
      APK74_SHA256: ${{ inputs.apk74_sha256 }}
    steps:
      - name: Verify reviewed QA branch identity
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          TRANSFER_ID: ${{ inputs.transfer_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/qa/apk74-x86 ]]
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$EXPECTED_HEAD" ]]
          [[ "$APK74_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$TRANSFER_ID" =~ ^[a-f0-9]{20}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only the reviewed QA APK74
        env:
          QA_APK74_DOWNLOAD_URL: ${{ secrets.QA_APK74_DOWNLOAD_URL }}
          QA_APK74_URL_1: ${{ secrets.QA_APK74_URL_1 }}
          QA_APK74_URL_2: ${{ secrets.QA_APK74_URL_2 }}
          QA_APK74_URL_3: ${{ secrets.QA_APK74_URL_3 }}
          QA_APK74_URL_4: ${{ secrets.QA_APK74_URL_4 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export QA_APK_DIR="$RUNNER_TEMP/apk74-inputs"
          printf 'QA_APK_DIR=%s\n' "$QA_APK_DIR" >> "$GITHUB_ENV"
          python3 scripts/qa/prepare_qa.py --output "$QA_APK_DIR/apk74-qa.apk" \
            --proof scripts/qa/qa-package-proof.json --expected-sha256 "$APK74_SHA256" \
            --url-policy scripts/qa/transfer-url-policy.json

      - name: Verify downloaded APK before emulator preparation
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$tools/aapt" || ! -f "$tools/lib/apksigner.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' </dev/null
          fi
          python3 scripts/qa/verify_download.py --apk "$QA_APK_DIR/apk74-qa.apk" \
            --release-manifest scripts/qa/release-manifest.json --package-proof scripts/qa/qa-package-proof.json \
            --expected-sha256 "$APK74_SHA256" --aapt "$tools/aapt" --java "$JAVA_HOME/bin/java" \
            --apksigner-jar "$tools/lib/apksigner.jar"

      - name: Prepare the pinned Android system image and KVM
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]]
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          [[ -r /dev/kvm && -w /dev/kvm ]]
          avd_home="$RUNNER_TEMP/apk74-android-avd"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          image="$ANDROID_HOME/system-images/android-30/google_apis/x86_64"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [[ ! -f "$image/system.img" || ! -x "$build_tools/apksigner" ]]; then
            "$sdkmanager" 'system-images;android-30;google_apis;x86_64' 'build-tools;36.0.0' </dev/null
          fi
          [[ -f "$image/system.img" && -x "$build_tools/aapt" && -x "$build_tools/apksigner" ]]
          grep -Eq '^Pkg\.Revision=16[[:space:]]*$' "$image/source.properties"
          archive="$RUNNER_TEMP/emulator-37.1.11.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --connect-timeout 20 --max-time 240 -o "$archive" \
            https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip
          printf '%s  %s\n' '95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266' "$archive" | sha256sum --check
          mkdir -p "$avd_home" "$RUNNER_TEMP/apk74-emulator"
          unzip -q "$archive" -d "$RUNNER_TEMP/apk74-emulator"
          emulator="$RUNNER_TEMP/apk74-emulator/emulator/emulator"
          "$emulator" -accel-check | grep -Eq 'KVM.*(installed|usable)'
          export ANDROID_AVD_HOME="$avd_home"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd \
            --name manager247_apk74 --package 'system-images;android-30;google_apis;x86_64' --device pixel_3a
          printf 'ANDROID_AVD_HOME=%s\nQA_APK_DIR=%s\nQA_EMULATOR=%s\n' \
            "$avd_home" "$RUNNER_TEMP/apk74-inputs" "$emulator" >> "$GITHUB_ENV"

      - name: Exercise offline HACCP attendance PDF and gallery
        id: demo
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          receiver="$RUNNER_TEMP/apk74-receiver"
          mkdir -m 700 "$receiver"
          cp scripts/qa/apk73-native-extra/receiver/{AndroidManifest.xml,PdfReceiverActivity.java,build.py} "$receiver/"
          python3 "$receiver/build.py" --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          emulator_pid=
          cleanup() {
            if [[ -n "$emulator_pid" ]]; then
              timeout 10 "$adb" -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
              kill "$emulator_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          "$QA_EMULATOR" -avd manager247_apk74 -port 5554 -accel on -gpu swiftshader \
            -no-window -no-snapshot -no-boot-anim -no-audio -camera-back none -camera-front none \
            >"$RUNNER_TEMP/apk74-emulator.log" 2>&1 &
          emulator_pid=$!
          ready=false
          for ((attempt=0; attempt<90; attempt++)); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            if [[ "$(timeout 3 "$adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]] \
              && timeout 5 "$adb" -s "$ANDROID_SERIAL" shell service check package 2>/dev/null | grep -q 'Service package: found'; then
              ready=true; break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          "$adb" -s "$ANDROID_SERIAL" shell wm dismiss-keyguard
          qa_signer="$(python3 -c 'import json; print(json.load(open("scripts/qa/qa-package-proof.json"))["qaSignerSha256"])')"
          result=0
          timeout 900 python3 -B scripts/qa/native_qa_x86.py --execute \
            --release-manifest scripts/qa/release-manifest.json --package-proof scripts/qa/qa-package-proof.json \
            --apk "$QA_APK_DIR/apk74-qa.apk" --expected-sha256 "$APK74_SHA256" --expected-signer-sha256 "$qa_signer" \
            --adb "$adb" --serial "$ANDROID_SERIAL" --aapt "$tools/aapt" --java "$JAVA_HOME/bin/java" \
            --apksigner-jar "$tools/lib/apksigner.jar" --receiver-apk "$receiver/out/qa-pdf-sink.apk" \
            --receiver-evidence "$receiver/out/build-evidence.json" --evidence "$RUNNER_TEMP/apk74-evidence" || result=$?
          {
            printf '### APK74 source-matched x86 demo QA\n\nOriginal ARM64 runtime acceptance: NOT_VERIFIED. Upgrade acceptance: NOT_RUN.\n\n'
            if [[ -f "$RUNNER_TEMP/apk74-evidence/native-x86-qa-report.json" ]]; then
              sed 's/^/    /' "$RUNNER_TEMP/apk74-evidence/native-x86-qa-report.json"
            else
              printf 'INCOMPLETE: no verified demo report.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Select approved synthetic screenshots
        id: images
        if: ${{ !cancelled() && (steps.demo.outcome == 'success' || steps.demo.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          images="$(python3 scripts/qa/apk73-functional-qa.py --list-screenshots "$RUNNER_TEMP/apk74-evidence")"
          if [[ -n "$images" ]]; then
            printf 'paths<<QA_IMAGES\n%s\nQA_IMAGES\n' "$images" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() && steps.images.outputs.paths != '' }}
        with:
          name: apk74-x86-synthetic-demo-screenshots
          path: ${{ steps.images.outputs.paths }}
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary QA inputs and guest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$(realpath -e -- "$RUNNER_TEMP")"
          [[ -d "$root" && "$root" != / ]]
          for name in apk74-inputs apk74-android-avd apk74-evidence apk74-receiver; do
            path="$root/$name"
            [[ ! -L "$path" && "$(realpath -m -- "$path")" == "$path" ]]
            if [[ -d "$path" ]]; then rm -rf -- "$path"; fi
          done

