<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Autentificare · Manager 24/7</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5EF;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #17212B; padding: 24px; }
  .card { background: #fff; border: 1px solid #DDE4E8; border-radius: 24px; padding: 32px; max-width: 420px; width: 100%;
          box-shadow: 0 8px 30px rgba(3,27,51,.07); text-align: center; }
  .kicker { color: #D5A640; font-size: 11px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase; }
  h1 { font-size: 21px; margin: 10px 0 8px; color: #031B33; }
  p { color: #667482; font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
  a.button { display: inline-block; margin-top: 18px; background: #D5A640; color: #031B33; text-decoration: none;
             font-weight: 900; font-size: 14px; padding: 13px 22px; border-radius: 16px; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 18px; border: 3px solid #EDF1F4; border-top-color: #D5A640;
             border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="spinner" id="spinner"></div>
    <div class="kicker">PARADIM Operations</div>
    <h1 id="title">Te conectăm…</h1>
    <p id="message">Te ducem în aplicație. Durează o secundă.</p>
    <a class="button hidden" id="manual" href="https://foodcost.paradim.ro/">Deschide aplicația</a>
  </main>

<script>
/*
 * Pagina de callback pentru linkul de acces trimis pe email.
 * Supabase trimite utilizatorul aici; aplicația rulează pe foodcost.paradim.ro,
 * unde se află verificatorul PKCE, așa că mutăm mai departe parametrii primiți
 * fără să atingem sau să stocăm nimic aici.
 */
(function () {
  var APP = 'https://foodcost.paradim.ro/';
  var search = window.location.search || '';
  var hash = window.location.hash || '';
  var params = new URLSearchParams(search.replace(/^\?/, ''));

  var title = document.getElementById('title');
  var message = document.getElementById('message');
  var manual = document.getElementById('manual');
  var spinner = document.getElementById('spinner');

  function fail(text) {
    spinner.classList.add('hidden');
    title.textContent = 'Linkul nu a putut fi folosit';
    message.textContent = text;
    manual.classList.remove('hidden');
  }

  if (params.get('error') || params.get('error_description')) {
    fail(params.get('error_description') || 'Cere un link nou din aplicație și încearcă din nou.');
    return;
  }

  if (!search && !hash) {
    fail('Deschide linkul direct din emailul primit, fără să îl modifici.');
    return;
  }

  var target = APP + search + hash;
  manual.setAttribute('href', target);
  window.setTimeout(function () { window.location.replace(target); }, 150);
  window.setTimeout(function () { manual.classList.remove('hidden'); }, 2500);
})();
</script>
</body>
</html>
